name: Publish checkout

on:
  workflow_dispatch:
    inputs:
      version:
        description: "OCI tag for sql-query (empty → .asd :version)"
        required: false
        default: ""
        type: string
      dialect_version:
        description: "OCI tag for dialect backends (default 0.2.0)"
        required: false
        default: "0.2.0"
        type: string
      packager_version:
        description: "Packager image version"
        required: false
        default: "0.16.0"
        type: string
      publish_dialects:
        description: "Also publish sql-query-postgres / sql-query-sqlite3 (GHCR ACL still linked here post-split)"
        required: false
        default: true
        type: boolean

jobs:
  publish-sql-query:
    uses: egao1980/cl-repository/.github/workflows/publish-source.yml@main
    with:
      system: sql-query
      version: ${{ inputs.version }}
      packager-version: ${{ inputs.packager_version }}
    permissions:
      contents: read
      packages: write

  # Dialect GHCR ACL is still linked to this repo (owning-repo publish 403 as
  # of 2026-08-25; Package Actions-access API is not grantable from here).
  # Long-term: grant Write to the dialect repos and drop this job.
  publish-dialects:
    if: ${{ inputs.publish_dialects }}
    needs: publish-sql-query
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: sql-query-postgres
            repo: egao1980/sql-query-postgres
          - system: sql-query-sqlite3
            repo: egao1980/sql-query-sqlite3
    runs-on: ubuntu-latest
    container: ghcr.io/egao1980/cl-repository/ci-base:latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write
    env:
      SBCL_VERSION: 2.6.7
      ROSWELL_VERSION: "26.02.116"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ matrix.repo }}
      - uses: egao1980/cl-repository/.github/actions/setup-lisp@main
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}
      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: publish
          system: ${{ matrix.system }}
          version: ${{ inputs.dialect_version }}
          packager-version: ${{ inputs.packager_version }}
